name: Test bot

on:
  push:
    # core.js: i calcoli di Noillirk del sito sono provati insieme al bot (test/site-noillirk.test.js)
    paths: ['bot/**', 'docs/assets/core.js', '.github/workflows/bot-tests.yml']
  pull_request:
    paths: ['bot/**', 'docs/assets/core.js', '.github/workflows/bot-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npm test
